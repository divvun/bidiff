[package]
name = "bidiff"
version = "2.0.0-dev"
description = "A (distantly) bsdiff-derived binary diff and patch library"
license = "Apache-2.0 OR MIT"
authors = ["Brendan Molloy <brendan@bbqsrc.net>", "Amos Wenger <amoswenger@gmail.com>"]
edition = "2024"
repository = "https://github.com/divvun/bidiff"

[features]
default = ["diff", "patch", "mmap"]
diff = ["rayon", "ringbuf", "dep:memmap2", "tempfile"]
patch = ["integer-encoding", "zstd", "dep:blake3"]
rayon = ["dep:rayon", "blake3?/rayon"]
mmap = ["patch", "dep:memmap2"]
instructions = []
profiling = []

[dependencies]
tracing = "0.1"
integer-encoding = { version = "4", default-features = false, optional = true }
zstd = { version = "0.13", optional = true }
rayon = { version = "1.11", optional = true }
ringbuf = { version = "0.4", optional = true }
memmap2 = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
blake3 = { version = "1.8", optional = true }

[dev-dependencies]
proptest = "1"
zstd = "0.13"
blake3 = "1.8"
tempfile = "3"

[workspace]
members = ["cli"]

# zstd's C code at -O0 makes the level-22 tests take minutes.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
panic = "abort"
split-debuginfo = "packed"
